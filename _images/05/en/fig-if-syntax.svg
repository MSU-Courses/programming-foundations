<svg xmlns="http://www.w3.org/2000/svg" viewBox="25 39 830 259.6" width="830" height="259.6" role="img" aria-label="Parts of an if statement: keyword, condition in parentheses, and body" font-family="Consolas, Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace">
<style>
.bg{fill:#ffffff}.surf{fill:#ffffff}.panel{fill:#f3f6fb}
.ln{stroke:#ccd6e5}.tx{fill:#16202f}.tm{fill:#64748b}
.ac{fill:#4338ca}.acs{stroke:#4338ca}.acb{fill:#eef0ff}.aci{fill:#3730a3}
.wn{fill:#b4232b}.wns{stroke:#b4232b}.wnb{fill:#fdf1f1}
.ok{fill:#0f766e}.oks{stroke:#0f766e}.okb{fill:#eaf6f4}
.ar{stroke:#16202f}.onacc{fill:#ffffff}
</style><defs>
<marker id="ai" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="tx" d="M 0 1 L 9 5 L 0 9 z" fill="#16202f"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ac" d="M 0 1 L 9 5 L 0 9 z" fill="#4338ca"/></marker>
<marker id="aw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="wn" d="M 0 1 L 9 5 L 0 9 z" fill="#b4232b"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ok" d="M 0 1 L 9 5 L 0 9 z" fill="#0f766e"/></marker>
</defs>

<rect class="bg" x="25" y="39" width="830" height="259.6" fill="#ffffff"/>
<rect class="panel ln" x="40" y="54" width="480" height="130" rx="12" fill="#f3f6fb" stroke="#ccd6e5" stroke-width="1.5"/>
<text class="ac" x="72.0" y="96" text-anchor="start" font-size="18.4" font-weight="700" fill="#4338ca">if</text>
<text class="tx" x="102.0" y="96" text-anchor="start" font-size="18.4" font-weight="700" fill="#16202f">(health &lt;= 0)</text>
<text class="tm" x="300.0" y="96" text-anchor="start" font-size="18.4" font-weight="700" fill="#64748b">{</text>
<text class="tx" x="100.0" y="130" text-anchor="start" font-size="12.88" font-weight="500" fill="#16202f">std::cout &lt;&lt; &quot;Game Over\n&quot;;</text>
<text class="tm" x="72.0" y="164" text-anchor="start" font-size="18.4" font-weight="700" fill="#64748b">}</text>
<line class="ln" x1="305" y1="184" x2="305" y2="206" stroke="#ccd6e5" stroke-width="1.5" stroke-linecap="round"/>
<line class="ln" x1="305" y1="206" x2="323" y2="206" stroke="#ccd6e5" stroke-width="1.5" stroke-linecap="round"/>
<text class="tx" x="331.0" y="211" text-anchor="start" font-size="11.96" font-weight="600" fill="#16202f">braces enclose the body</text>
<line class="ln" x1="180" y1="184" x2="180" y2="240" stroke="#ccd6e5" stroke-width="1.5" stroke-linecap="round"/>
<line class="ln" x1="180" y1="240" x2="198" y2="240" stroke="#ccd6e5" stroke-width="1.5" stroke-linecap="round"/>
<text class="tx" x="206.0" y="245" text-anchor="start" font-size="11.96" font-weight="600" fill="#16202f">condition in parentheses</text>
<text class="tm" x="206.0" y="262" text-anchor="start" font-size="10.58" font-weight="400" fill="#64748b">evaluates to true or false</text>
<line class="ln" x1="80" y1="184" x2="80" y2="276" stroke="#ccd6e5" stroke-width="1.5" stroke-linecap="round"/>
<line class="ln" x1="80" y1="276" x2="98" y2="276" stroke="#ccd6e5" stroke-width="1.5" stroke-linecap="round"/>
<text class="tx" x="106.0" y="281" text-anchor="start" font-size="11.96" font-weight="600" fill="#16202f">language keyword</text>
<rect class="okb oks" x="560" y="96" width="280" height="60" rx="12" fill="#eaf6f4" stroke="#0f766e" stroke-width="1.5"/>
<text class="tm" x="700.0" y="122" text-anchor="middle" font-size="11.5" font-weight="500" fill="#64748b">body</text>
<text class="ok" x="700.0" y="143" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e">runs if the condition is true</text>
<line class="ar" x1="534" y1="126" x2="552" y2="126" stroke="#16202f" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ai)"/>
</svg>

