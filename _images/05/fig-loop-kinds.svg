<text class="tx" x="720.0" y="240.3056" text-anchor="middle" font-size="11.96" font-weight="500" fill="#16202f">тело</text>
<line class="ar" x1="720" y1="254" x2="720" y2="268" stroke="#16202f" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ai)"/>
