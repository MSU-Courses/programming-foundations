<svg xmlns="http://www.w3.org/2000/svg" viewBox="25 5.3 830 407.9" width="830" height="407.9" role="img" aria-label="Три вида циклов: while, do while и for" font-family="Consolas, Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace">
<style>
.bg{fill:#ffffff}.surf{fill:#ffffff}.panel{fill:#f3f6fb}
.ln{stroke:#ccd6e5}.tx{fill:#16202f}.tm{fill:#64748b}
.ac{fill:#4338ca}.acs{stroke:#4338ca}.acb{fill:#eef0ff}.aci{fill:#3730a3}
.wn{fill:#b4232b}.wns{stroke:#b4232b}.wnb{fill:#fdf1f1}
.ok{fill:#0f766e}.oks{stroke:#0f766e}.okb{fill:#eaf6f4}
.ar{stroke:#16202f}.onacc{fill:#ffffff}
</style><defs>
<marker id="ai" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="tx" d="M 0 1 L 9 5 L 0 9 z" fill="#16202f"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ac" d="M 0 1 L 9 5 L 0 9 z" fill="#4338ca"/></marker>
<marker id="aw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="wn" d="M 0 1 L 9 5 L 0 9 z" fill="#b4232b"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ok" d="M 0 1 L 9 5 L 0 9 z" fill="#0f766e"/></marker>
</defs>

<rect class="bg" x="25" y="5.3" width="830" height="407.9" fill="#ffffff"/>
<rect class="panel ln" x="40" y="66" width="240" height="300" rx="12" fill="#f3f6fb" stroke="#ccd6e5" stroke-width="1.5"/>
<text class="tx" x="160.0" y="34" text-anchor="middle" font-size="14.72" font-weight="700" fill="#16202f">while</text>
<text class="tm" x="160.0" y="52" text-anchor="middle" font-size="10.58" font-weight="400" fill="#64748b">условие проверяется до тела</text>
<text class="tm" x="160.0" y="396" text-anchor="middle" font-size="10.58" font-weight="400" fill="#64748b">Тело может не выполниться ни разу</text>
<rect class="panel ln" x="320" y="66" width="240" height="300" rx="12" fill="#f3f6fb" stroke="#ccd6e5" stroke-width="1.5"/>
<text class="tx" x="440.0" y="34" text-anchor="middle" font-size="14.72" font-weight="700" fill="#16202f">do while</text>
<text class="tm" x="440.0" y="52" text-anchor="middle" font-size="10.58" font-weight="400" fill="#64748b">условие проверяется после тела</text>
<text class="tm" x="440.0" y="396" text-anchor="middle" font-size="10.58" font-weight="400" fill="#64748b">Тело выполнится хотя бы один раз</text>
<rect class="panel ln" x="600" y="66" width="240" height="300" rx="12" fill="#f3f6fb" stroke="#ccd6e5" stroke-width="1.5"/>
<text class="tx" x="720.0" y="34" text-anchor="middle" font-size="14.72" font-weight="700" fill="#16202f">for</text>
<text class="tm" x="720.0" y="52" text-anchor="middle" font-size="10.58" font-weight="400" fill="#64748b">счётчик задан в заголовке</text>
<text class="tm" x="720.0" y="396" text-anchor="middle" font-size="10.58" font-weight="400" fill="#64748b">Когда известно число повторений</text>
