<svg xmlns="http://www.w3.org/2000/svg" viewBox="24 33 636 504" width="636" height="504" role="img" aria-label="Блок-схема: ввод, вычитание, проверка условия и две ветки вывода" font-family="Consolas, Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace">
