<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 920 325" width="920" height="325" role="img" aria-label="Схема выбора: одно значение - переменная, если это одно число, или структура, если это несколько свойств предмета; много значений - массив для списка, матрица для таблицы, массив структур для многих предметов" font-family="Consolas, Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace">
<defs>
<marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#4338ca"/></marker>
<marker id="ai" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#16202f"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#0f766e"/></marker>
</defs>
<rect x="0" y="0" width="920" height="325" fill="#ffffff"/>
<rect x="300" y="20" width="260" height="52" rx="10" fill="#ffffff" stroke="#16202f" stroke-width="1.5"/>
<text x="430" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="#16202f">Сколько значений?</text>
<text x="430" y="60" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">одно или много</text>
<rect x="80" y="120" width="300" height="52" rx="10" fill="#ffffff" stroke="#16202f" stroke-width="1.5"/>
<text x="230" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#16202f">Одно: какого вида?</text>
<text x="230" y="160" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">одно число или несколько свойств</text>
<rect x="480" y="120" width="300" height="52" rx="10" fill="#ffffff" stroke="#16202f" stroke-width="1.5"/>
<text x="630" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#16202f">Много: какой формы?</text>
<text x="630" y="160" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">список, таблица или предметы</text>
<path d="M 380 72 L 260 116" stroke="#16202f" stroke-width="2" fill="none" marker-end="url(#ai)"/>
<path d="M 480 72 L 600 116" stroke="#16202f" stroke-width="2" fill="none" marker-end="url(#ai)"/>
<rect x="20" y="220" width="190" height="62" rx="10" fill="#eef0ff" stroke="#4338ca" stroke-width="1.5"/><text x="115.0" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca">Переменная</text><text x="115.0" y="264" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">coins</text>
<rect x="230" y="220" width="190" height="62" rx="10" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/><text x="325.0" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">Структура</text><text x="325.0" y="264" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">potion.price</text>
<rect x="440" y="220" width="140" height="62" rx="10" fill="#eef0ff" stroke="#4338ca" stroke-width="1.5"/><text x="510.0" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca">Массив</text><text x="510.0" y="264" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">scores[i]</text>
<rect x="595" y="220" width="140" height="62" rx="10" fill="#eef0ff" stroke="#4338ca" stroke-width="1.5"/><text x="665.0" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca">Матрица</text><text x="665.0" y="264" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">map[row][col]</text>
<rect x="750" y="220" width="150" height="62" rx="10" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/><text x="825.0" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">Массив структур</text><text x="825.0" y="264" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">items[i].price</text>
<path d="M 170 172 L 115 214" stroke="#16202f" stroke-width="2" fill="none" marker-end="url(#ai)"/>
<path d="M 290 172 L 325 214" stroke="#16202f" stroke-width="2" fill="none" marker-end="url(#ai)"/>
<path d="M 560 172 L 510 214" stroke="#16202f" stroke-width="2" fill="none" marker-end="url(#ai)"/>
<path d="M 630 172 L 665 214" stroke="#16202f" stroke-width="2" fill="none" marker-end="url(#ai)"/>
<path d="M 700 172 L 825 214" stroke="#16202f" stroke-width="2" fill="none" marker-end="url(#ai)"/>
<text x="115" y="306" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">одно число</text>
<text x="325" y="306" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">несколько свойств</text>
<text x="510" y="306" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">список</text>
<text x="665" y="306" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">таблица</text>
<text x="825" y="306" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">много предметов</text>
</svg>
