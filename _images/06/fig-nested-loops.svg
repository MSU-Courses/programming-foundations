<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 830 250" width="830" height="250" role="img" aria-label="Три прохода внешнего цикла, внутри каждого внутренний цикл выполняется заново с enemy равным 1 и 2" font-family="Consolas, Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace">
<style>
.bg{fill:#ffffff}.surf{fill:#ffffff}.panel{fill:#f3f6fb}
.ln{stroke:#ccd6e5}.tx{fill:#16202f}.tm{fill:#64748b}
.ac{fill:#4338ca}.acs{stroke:#4338ca}.acb{fill:#eef0ff}.aci{fill:#3730a3}
.wn{fill:#b4232b}.wns{stroke:#b4232b}.wnb{fill:#fdf1f1}
.ok{fill:#0f766e}.oks{stroke:#0f766e}.okb{fill:#eaf6f4}
.ar{stroke:#16202f}.onacc{fill:#ffffff}
</style><defs>
<marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#4338ca"/></marker>
<marker id="ai" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#16202f"/></marker>
</defs>
<rect x="0" y="0" width="830" height="250" fill="#ffffff"/>
<text class="aci" x="20" y="32" text-anchor="start" font-size="12.5" font-weight="700" fill="#3730a3">Внешний цикл: wave от 1 до 3</text>
<rect x="20" y="48" width="250" height="150" rx="12" fill="#eef0ff" stroke="#4338ca" stroke-width="1.5"/>
<text class="aci" x="36" y="76" text-anchor="start" font-size="12.5" font-weight="700" fill="#3730a3">wave = 1</text>
<text class="ok" x="36" y="100" text-anchor="start" font-size="11.5" font-weight="700" fill="#0f766e">Внутренний цикл:</text>
<rect x="36" y="112" width="104" height="64" rx="10" fill="#eaf6f4" stroke="#0f766e" stroke-width="1.5"/>
<text class="ok" x="88" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e">enemy = 1</text>
<text class="tm" x="88" y="162" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">вывод</text>
<rect x="150" y="112" width="104" height="64" rx="10" fill="#eaf6f4" stroke="#0f766e" stroke-width="1.5"/>
<text class="ok" x="202" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e">enemy = 2</text>
<text class="tm" x="202" y="162" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">вывод</text>
<path d="M 272 123 L 288 123" stroke="#16202f" stroke-width="1.5" marker-end="url(#ai)" fill="none"/>
<rect x="290" y="48" width="250" height="150" rx="12" fill="#eef0ff" stroke="#4338ca" stroke-width="1.5"/>
<text class="aci" x="306" y="76" text-anchor="start" font-size="12.5" font-weight="700" fill="#3730a3">wave = 2</text>
<text class="ok" x="306" y="100" text-anchor="start" font-size="11.5" font-weight="700" fill="#0f766e">Внутренний цикл:</text>
<rect x="306" y="112" width="104" height="64" rx="10" fill="#eaf6f4" stroke="#0f766e" stroke-width="1.5"/>
<text class="ok" x="358" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e">enemy = 1</text>
<text class="tm" x="358" y="162" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">вывод</text>
<rect x="420" y="112" width="104" height="64" rx="10" fill="#eaf6f4" stroke="#0f766e" stroke-width="1.5"/>
<text class="ok" x="472" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e">enemy = 2</text>
<text class="tm" x="472" y="162" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">вывод</text>
<path d="M 542 123 L 558 123" stroke="#16202f" stroke-width="1.5" marker-end="url(#ai)" fill="none"/>
<rect x="560" y="48" width="250" height="150" rx="12" fill="#eef0ff" stroke="#4338ca" stroke-width="1.5"/>
<text class="aci" x="576" y="76" text-anchor="start" font-size="12.5" font-weight="700" fill="#3730a3">wave = 3</text>
<text class="ok" x="576" y="100" text-anchor="start" font-size="11.5" font-weight="700" fill="#0f766e">Внутренний цикл:</text>
<rect x="576" y="112" width="104" height="64" rx="10" fill="#eaf6f4" stroke="#0f766e" stroke-width="1.5"/>
<text class="ok" x="628" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e">enemy = 1</text>
<text class="tm" x="628" y="162" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">вывод</text>
<rect x="690" y="112" width="104" height="64" rx="10" fill="#eaf6f4" stroke="#0f766e" stroke-width="1.5"/>
<text class="ok" x="742" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e">enemy = 2</text>
<text class="tm" x="742" y="162" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">вывод</text>
<text class="tx" x="20" y="226" text-anchor="start" font-size="12" font-weight="700" fill="#16202f">Тело внутреннего цикла выполняется 3 * 2 = 6 раз;</text>
<text class="tm" x="20" y="244" text-anchor="start" font-size="11.5" font-weight="500" fill="#64748b">на каждом проходе внешнего цикла внутренний начинается с enemy = 1</text>
</svg>
