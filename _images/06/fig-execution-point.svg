<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 830 330" width="830" height="330" role="img" aria-label="Точка выполнения четыре раза оказывается на строке вычитания, и при каждом проходе значения переменных разные" font-family="Consolas, Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace">
