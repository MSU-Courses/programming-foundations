<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 830 450" width="830" height="450" role="img" aria-label="Куда передают управление break и continue в цикле for" font-family="Consolas, Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace">
<defs>
<marker id="ai" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#16202f"/></marker>
<marker id="aw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#b4232b"/></marker>
</defs>
<rect x="0" y="0" width="830" height="450" fill="#ffffff"/>
<text x="30" y="24" font-size="13" font-weight="700" fill="#3730a3">break: выход из всего цикла</text>
<rect x="130" y="40" width="160" height="30" rx="8" fill="#f3f6fb" stroke="#ccd6e5" stroke-width="1.5"/>
<text x="210.0" y="59.0" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b">turn = 1</text>
