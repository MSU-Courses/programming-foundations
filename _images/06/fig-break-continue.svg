<text x="616" y="160" text-anchor="start" font-size="11" font-weight="600" fill="#64748b">да</text>
<path d="M 610 144 L 610 168" fill="none" stroke="#16202f" stroke-width="1.4" marker-end="url(#ai)"/>
<path d="M 610 168 L 700 194 L 610 220 L 520 194 Z" fill="#eaf6f4" stroke="#0f766e" stroke-width="1.5"/>
<text x="610" y="198" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e">turn % 3 == 0 ?</text>
<path d="M 700 194 L 722 194" fill="none" stroke="#16202f" stroke-width="1.4" marker-end="url(#ai)"/>
<text x="702" y="186" text-anchor="start" font-size="11" font-weight="600" fill="#64748b">да</text>
<rect x="722" y="180" width="86" height="30" rx="8" fill="#fdf1f1" stroke="#b4232b" stroke-width="1.5"/>
<text x="765.0" y="199.0" text-anchor="middle" font-size="12" font-weight="600" fill="#b4232b">continue</text>
<path d="M 765 210 L 765 327 L 690 327" fill="none" stroke="#b4232b" stroke-width="2" marker-end="url(#aw)"/>
<path d="M 610 220 L 610 250" fill="none" stroke="#16202f" stroke-width="1.4" marker-end="url(#ai)"/>
<text x="616" y="240" text-anchor="start" font-size="11" font-weight="600" fill="#64748b">нет</text>
<rect x="530" y="250" width="160" height="30" rx="8" fill="#ffffff" stroke="#ccd6e5" stroke-width="1.5"/>
<text x="610.0" y="269.0" text-anchor="middle" font-size="12" font-weight="600" fill="#16202f">вывод "hit"</text>
<path d="M 610 280 L 610 312" fill="none" stroke="#16202f" stroke-width="1.4" marker-end="url(#ai)"/>
<rect x="530" y="312" width="160" height="30" rx="8" fill="#ffffff" stroke="#ccd6e5" stroke-width="1.5"/>
<text x="610.0" y="331.0" text-anchor="middle" font-size="12" font-weight="600" fill="#16202f">turn = turn + 1</text>
<path d="M 530 327 L 498 327 L 498 132 L 548 132" fill="none" stroke="#16202f" stroke-width="1.4" marker-end="url(#ai)"/>
<path d="M 520 118 L 470 118 L 470 412 L 530 412" fill="none" stroke="#16202f" stroke-width="1.4" marker-end="url(#ai)"/>
<text x="474" y="110" text-anchor="start" font-size="11" font-weight="600" fill="#64748b">нет</text>
<rect x="530" y="390" width="160" height="34" rx="8" fill="#eef0ff" stroke="#4338ca" stroke-width="1.5"/>
<text x="610.0" y="411.0" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">после цикла</text>
</svg>