<text class="tm" x="690" y="76" text-anchor="start" font-size="11" font-weight="700" fill="#64748b">Value</text>
<text class="tm" x="760" y="76" text-anchor="start" font-size="11" font-weight="700" fill="#64748b">Type</text>
<path d="M 540 86 L 800 86" stroke="#ccd6e5" stroke-width="1"/>
<text class="tx" x="546" y="106" text-anchor="start" font-size="12" font-weight="500" fill="#16202f">enemyHealth</text>
<text class="tx" x="690" y="106" text-anchor="start" font-size="12" font-weight="700" fill="#16202f">70</text>
<text class="tm" x="760" y="106" text-anchor="start" font-size="12" font-weight="500" fill="#64748b">int</text>
<path d="M 540 118 L 800 118" stroke="#ccd6e5" stroke-width="1"/>
<text class="tx" x="546" y="138" text-anchor="start" font-size="12" font-weight="500" fill="#16202f">damage</text>
<text class="tx" x="690" y="138" text-anchor="start" font-size="12" font-weight="700" fill="#16202f">30</text>
<text class="tm" x="760" y="138" text-anchor="start" font-size="12" font-weight="500" fill="#64748b">int</text>
<path d="M 540 150 L 800 150" stroke="#ccd6e5" stroke-width="1"/>
<text class="tx" x="546" y="170" text-anchor="start" font-size="12" font-weight="500" fill="#16202f">hits</text>
<text class="tx" x="690" y="170" text-anchor="start" font-size="12" font-weight="700" fill="#16202f">1</text>
<text class="tm" x="760" y="170" text-anchor="start" font-size="12" font-weight="500" fill="#64748b">int</text>
<rect x="530" y="226" width="280" height="84" rx="12" fill="#f3f6fb" stroke="#ccd6e5" stroke-width="1.5"/>
<text class="tm" x="546" y="252" text-anchor="start" font-size="11.5" font-weight="700" fill="#64748b">Второй проход цикла:</text>
<text class="tm" x="546" y="274" text-anchor="start" font-size="11.5" font-weight="500" fill="#64748b">первое вычитание уже</text>
<text class="tm" x="546" y="294" text-anchor="start" font-size="11.5" font-weight="500" fill="#64748b">выполнено, второе ещё нет</text>
