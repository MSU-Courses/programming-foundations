.wn{fill:#b4232b}.wns{stroke:#b4232b}.wnb{fill:#fdf1f1}
.ok{fill:#0f766e}.oks{stroke:#0f766e}.okb{fill:#eaf6f4}
.ar{stroke:#16202f}.onacc{fill:#ffffff}
</style><defs>
<marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#4338ca"/></marker>
<marker id="ai" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#16202f"/></marker>
</defs>
<rect x="0" y="0" width="830" height="330" fill="#ffffff"/>
<rect x="20" y="20" width="480" height="290" rx="12" fill="#ffffff" stroke="#ccd6e5" stroke-width="1.5"/>
<path d="M 20 52 L 500 52" stroke="#ccd6e5" stroke-width="1.5"/>
<text class="tm" x="36" y="42" text-anchor="start" font-size="12" font-weight="700" fill="#64748b">main.cpp</text>
<text class="tm" x="84" y="86" text-anchor="end" font-size="11.5" font-weight="500" fill="#64748b">18</text>
<text class="tx" x="100" y="86" text-anchor="start" font-size="12" font-weight="500" fill="#16202f">while (enemyHealth &gt; 0) {</text>
