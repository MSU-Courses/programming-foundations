<circle cx="38" cy="113" r="8" fill="#b4232b"/>
<path d="M 50 113 L 66 113" stroke="#4338ca" stroke-width="3" marker-end="url(#aa)" fill="none"/>
<text class="aci" x="100" y="118" text-anchor="start" font-size="12" font-weight="700" fill="#3730a3">    enemyHealth = enemyHealth - damage;</text>
<text class="tm" x="84" y="150" text-anchor="end" font-size="11.5" font-weight="500" fill="#64748b">20</text>
<text class="tx" x="100" y="150" text-anchor="start" font-size="12" font-weight="500" fill="#16202f">    hits = hits + 1;</text>
<text class="tm" x="84" y="182" text-anchor="end" font-size="11.5" font-weight="500" fill="#64748b">21</text>
<text class="tx" x="100" y="182" text-anchor="start" font-size="12" font-weight="500" fill="#16202f"></text>
<text class="tm" x="84" y="214" text-anchor="end" font-size="11.5" font-weight="500" fill="#64748b">22</text>
<text class="tx" x="100" y="214" text-anchor="start" font-size="12" font-weight="500" fill="#16202f">    std::cout &lt;&lt; "Hit " &lt;&lt; hits ...;</text>
<text class="tm" x="84" y="246" text-anchor="end" font-size="11.5" font-weight="500" fill="#64748b">23</text>
<text class="tx" x="100" y="246" text-anchor="start" font-size="12" font-weight="500" fill="#16202f">}</text>
<text class="wn" x="36" y="268" text-anchor="start" font-size="11.5" font-weight="700" fill="#b4232b">●  точка останова (F9)</text>
<text class="ac" x="36" y="290" text-anchor="start" font-size="11.5" font-weight="700" fill="#4338ca">→  точка выполнения: строка 19 ещё не выполнена</text>
<rect x="530" y="20" width="280" height="190" rx="12" fill="#ffffff" stroke="#ccd6e5" stroke-width="1.5"/>
