<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 830 330" width="830" height="330" role="img" aria-label="Схема окна отладчика: код с точкой останова и стрелкой текущей строки, окно Locals с переменными" font-family="Consolas, Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace">
<style>
.bg{fill:#ffffff}.surf{fill:#ffffff}.panel{fill:#f3f6fb}
.ln{stroke:#ccd6e5}.tx{fill:#16202f}.tm{fill:#64748b}
