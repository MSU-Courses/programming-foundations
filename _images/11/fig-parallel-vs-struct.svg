<text x="700" y="81" text-anchor="start" font-size="12" font-weight="700" fill="#0f766e">price 2</text>
<text x="790" y="81" text-anchor="start" font-size="12" font-weight="700" fill="#16202f">count 40</text>
<rect x="480" y="112" width="380" height="50" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
<text x="500" y="132" text-anchor="start" font-size="11" font-weight="700" fill="#64748b">[1]</text>
<text x="540" y="143" text-anchor="start" font-size="12" font-weight="700" fill="#16202f">name "Potion"</text>
<text x="700" y="143" text-anchor="start" font-size="12" font-weight="700" fill="#0f766e">price 25</text>
<text x="790" y="143" text-anchor="start" font-size="12" font-weight="700" fill="#16202f">count 3</text>
<rect x="480" y="174" width="380" height="50" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
<text x="500" y="194" text-anchor="start" font-size="11" font-weight="700" fill="#64748b">[2]</text>
<text x="540" y="205" text-anchor="start" font-size="12" font-weight="700" fill="#16202f">name "Shield"</text>
<text x="700" y="205" text-anchor="start" font-size="12" font-weight="700" fill="#0f766e">price 80</text>
<text x="790" y="205" text-anchor="start" font-size="12" font-weight="700" fill="#16202f">count 1</text>
<rect x="480" y="236" width="380" height="50" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
<text x="500" y="256" text-anchor="start" font-size="11" font-weight="700" fill="#64748b">[3]</text>
<text x="540" y="267" text-anchor="start" font-size="12" font-weight="700" fill="#16202f">name "Sword"</text>
<text x="700" y="267" text-anchor="start" font-size="12" font-weight="700" fill="#0f766e">price 120</text>
<text x="790" y="267" text-anchor="start" font-size="12" font-weight="700" fill="#16202f">count 1</text>
</svg>
