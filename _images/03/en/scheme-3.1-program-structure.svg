<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="880" height="300" fill="#ffffff"/>

  <rect x="30" y="30" width="380" height="230" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#0f172a">
    <text x="48" y="66">#include &lt;iostream&gt;</text>
    <text x="48" y="112">int main() {</text>
    <text x="76" y="158">std::cout &lt;&lt; "Hello!\n";</text>
    <text x="76" y="204">return 0;</text>
    <text x="48" y="250">}</text>
  </g>

  <g stroke="#cbd5e1" stroke-width="1.5">
    <line x1="220" y1="61" x2="430" y2="61"/>
    <line x1="180" y1="107" x2="430" y2="107"/>
    <line x1="320" y1="153" x2="430" y2="153"/>
    <line x1="190" y1="199" x2="430" y2="199"/>
    <line x1="70" y1="245" x2="430" y2="245"/>
  </g>

  <g font-size="13" fill="#334155">
    <text x="442" y="66">provides input and output facilities</text>
    <text x="442" y="112">entry point: execution begins here</text>
    <text x="442" y="158">prints text to the screen</text>
    <text x="442" y="195">tells the system that the program</text>
    <text x="442" y="213">finished successfully</text>
    <text x="442" y="250">end of the main function body</text>
  </g>
</svg>
