<text x="55" y="230" text-anchor="start" font-size="12.5" font-weight="400" fill="#334155">health - an integer occupying 4 bytes, numbered 100-103. Together, the four bytes represent the number 75.</text>
<text x="55" y="252" text-anchor="start" font-size="12.5" font-weight="400" fill="#334155">symbol - one character occupying 1 byte, number 104. It contains code 65, which represents the character A.</text>
<text x="55" y="280" text-anchor="start" font-size="11.5" font-weight="400" fill="#64748b">The byte numbers are illustrative; the actual locations are chosen by the compiler.</text>
