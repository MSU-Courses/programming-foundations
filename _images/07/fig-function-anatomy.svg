<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 830 380" width="830" height="380" role="img" aria-label="Части определения функции в C++: тип возвращаемого значения int, имя calculateDamage, параметры с типами в круглых скобках, тело в фигурных скобках и инструкция return" font-family="Consolas, Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace">
