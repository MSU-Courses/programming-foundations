<text x="60.0" y="150" text-anchor="start" font-size="15" font-weight="700" fill="#4338ca">int</text>
<text x="96.0" y="150" text-anchor="start" font-size="15" font-weight="700" fill="#3730a3">calculateDamage</text>
<text x="231.0" y="150" text-anchor="start" font-size="15" font-weight="700" fill="#0f766e">(int attack, int defense)</text>
<text x="465.0" y="150" text-anchor="start" font-size="15" font-weight="700" fill="#16202f">{</text>
<text x="60" y="180" text-anchor="start" font-size="15" font-weight="500" fill="#16202f">    int damage = attack - defense;</text>
<text x="60" y="210" text-anchor="start" font-size="15" font-weight="500" fill="#16202f">    if (damage &lt; 1) {</text>
<text x="60" y="240" text-anchor="start" font-size="15" font-weight="500" fill="#16202f">        damage = 1;</text>
<text x="60" y="270" text-anchor="start" font-size="15" font-weight="500" fill="#16202f">    }</text>
<rect x="92.0" y="280" width="134.0" height="28" rx="6" fill="#eef0ff" stroke="#4338ca" stroke-width="1.5"/>
<text x="96.0" y="300" text-anchor="start" font-size="15" font-weight="700" fill="#3730a3">return damage;</text>
<text x="60" y="330" text-anchor="start" font-size="15" font-weight="500" fill="#16202f">}</text>
