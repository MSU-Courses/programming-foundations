<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="520" height="300" fill="#ffffff"/>

  <!-- Действие -->
  <rect x="160" y="20" width="240" height="50" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="280" y="50" text-anchor="middle" font-size="14" fill="#0f172a">Создать одного врага</text>
  <line x1="280" y1="70" x2="280" y2="93" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Условие -->
  <path d="M 280 100 L 390 145 L 280 190 L 170 145 Z" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="280" y="150" text-anchor="middle" font-size="13" fill="#0f172a">Нужен ещё?</text>

  <!-- Возврат назад -->
  <line x1="170" y1="145" x2="80" y2="145" stroke="#475569" stroke-width="2"/>
  <line x1="80" y1="145" x2="80" y2="45" stroke="#475569" stroke-width="2"/>
  <line x1="80" y1="45" x2="152" y2="45" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="160" y="135" text-anchor="end" font-size="13" font-weight="600" fill="#334155">да</text>

  <!-- Дальше -->
  <line x1="280" y1="190" x2="280" y2="213" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="292" y="207" font-size="13" font-weight="600" fill="#334155">нет</text>
  <rect x="160" y="220" width="240" height="50" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="280" y="250" text-anchor="middle" font-size="14" fill="#0f172a">Начать бой</text>
</svg>
