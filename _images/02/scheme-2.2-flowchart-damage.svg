<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 580" width="700" height="580" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="580" fill="#ffffff"/>

  <!-- Начало -->
  <ellipse cx="350" cy="35" rx="70" ry="25" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="350" y="41" text-anchor="middle" font-size="15" fill="#0f172a">Начало</text>
  <line x1="350" y1="60" x2="350" y2="83" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Ввод -->
  <path d="M 240 140 L 265 90 L 460 90 L 435 140 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="350" y="121" text-anchor="middle" font-size="14" fill="#0f172a">Ввести health и damage</text>
  <line x1="350" y1="140" x2="350" y2="163" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Действие -->
  <rect x="225" y="170" width="250" height="50" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="350" y="200" text-anchor="middle" font-size="14" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">health = health - damage</text>
  <line x1="350" y1="220" x2="350" y2="243" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Условие -->
  <path d="M 350 250 L 462 300 L 350 350 L 238 300 Z" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="350" y="306" text-anchor="middle" font-size="14" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">health &lt;= 0</text>

  <!-- Ветка да -->
  <line x1="238" y1="300" x2="120" y2="300" stroke="#475569" stroke-width="2"/>
  <line x1="120" y1="300" x2="120" y2="373" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="228" y="290" text-anchor="end" font-size="13" font-weight="600" fill="#334155">да</text>
  <path d="M 40 430 L 62 380 L 200 380 L 178 430 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="120" y="410" text-anchor="middle" font-size="13" fill="#0f172a">Вывести "Game Over"</text>

  <!-- Ветка нет -->
  <line x1="462" y1="300" x2="580" y2="300" stroke="#475569" stroke-width="2"/>
  <line x1="580" y1="300" x2="580" y2="373" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="472" y="290" font-size="13" font-weight="600" fill="#334155">нет</text>
  <path d="M 500 430 L 522 380 L 660 380 L 638 430 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="580" y="410" text-anchor="middle" font-size="13" fill="#0f172a">Вывести health</text>

  <!-- Слияние -->
  <line x1="120" y1="430" x2="120" y2="490" stroke="#475569" stroke-width="2"/>
  <line x1="580" y1="430" x2="580" y2="490" stroke="#475569" stroke-width="2"/>
  <line x1="120" y1="490" x2="580" y2="490" stroke="#475569" stroke-width="2"/>
  <line x1="350" y1="490" x2="350" y2="513" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Конец -->
  <ellipse cx="350" cy="545" rx="70" ry="25" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="350" y="551" text-anchor="middle" font-size="15" fill="#0f172a">Конец</text>
</svg>
