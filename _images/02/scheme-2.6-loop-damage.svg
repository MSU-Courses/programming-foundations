<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 800" width="720" height="800" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="800" fill="#ffffff"/>

  <!-- Начало -->
  <ellipse cx="360" cy="35" rx="70" ry="25" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="360" y="41" text-anchor="middle" font-size="15" fill="#0f172a">Начало</text>
  <line x1="360" y1="60" x2="360" y2="83" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Ввести health -->
  <path d="M 250 140 L 275 90 L 470 90 L 445 140 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="360" y="121" text-anchor="middle" font-size="14" fill="#0f172a">Ввести health</text>
  <line x1="360" y1="140" x2="360" y2="163" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Условие цикла -->
  <path d="M 360 170 L 475 220 L 360 270 L 245 220 Z" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="360" y="226" text-anchor="middle" font-size="14" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">health &gt; 0</text>

  <!-- Выход из цикла -->
  <line x1="475" y1="220" x2="660" y2="220" stroke="#475569" stroke-width="2"/>
  <line x1="660" y1="220" x2="660" y2="750" stroke="#475569" stroke-width="2"/>
  <line x1="660" y1="750" x2="437" y2="750" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="485" y="212" font-size="13" font-weight="600" fill="#334155">нет</text>

  <!-- Тело цикла -->
  <line x1="360" y1="270" x2="360" y2="293" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="372" y="288" font-size="13" font-weight="600" fill="#334155">да</text>

  <path d="M 250 350 L 275 300 L 470 300 L 445 350 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="360" y="331" text-anchor="middle" font-size="14" fill="#0f172a">Ввести damage</text>
  <line x1="360" y1="350" x2="360" y2="373" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="235" y="380" width="250" height="50" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="360" y="410" text-anchor="middle" font-size="14" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">health = health - damage</text>
  <line x1="360" y1="430" x2="360" y2="453" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Проверка внутри цикла -->
  <path d="M 360 460 L 472 510 L 360 560 L 248 510 Z" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="360" y="516" text-anchor="middle" font-size="14" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">health &lt;= 0</text>

  <line x1="248" y1="510" x2="165" y2="510" stroke="#475569" stroke-width="2"/>
  <line x1="165" y1="510" x2="165" y2="583" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="238" y="500" text-anchor="end" font-size="13" font-weight="600" fill="#334155">да</text>

  <line x1="472" y1="510" x2="555" y2="510" stroke="#475569" stroke-width="2"/>
  <line x1="555" y1="510" x2="555" y2="583" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="482" y="500" font-size="13" font-weight="600" fill="#334155">нет</text>

  <path d="M 85 640 L 107 590 L 245 590 L 223 640 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="165" y="620" text-anchor="middle" font-size="13" fill="#0f172a">Вывести "Game Over"</text>

  <path d="M 475 640 L 497 590 L 635 590 L 613 640 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="555" y="620" text-anchor="middle" font-size="13" fill="#0f172a">Вывести health</text>

  <!-- Слияние и возврат к условию -->
  <line x1="165" y1="640" x2="165" y2="690" stroke="#475569" stroke-width="2"/>
  <line x1="555" y1="640" x2="555" y2="690" stroke="#475569" stroke-width="2"/>
  <line x1="165" y1="690" x2="555" y2="690" stroke="#475569" stroke-width="2"/>
  <line x1="360" y1="690" x2="360" y2="712" stroke="#475569" stroke-width="2"/>
  <line x1="360" y1="712" x2="55" y2="712" stroke="#475569" stroke-width="2"/>
  <line x1="55" y1="712" x2="55" y2="220" stroke="#475569" stroke-width="2"/>
  <line x1="55" y1="220" x2="238" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="64" y="420" font-size="13" font-weight="600" fill="#334155">повторить</text>

  <!-- Конец -->
  <ellipse cx="360" cy="750" rx="70" ry="25" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="360" y="756" text-anchor="middle" font-size="15" fill="#0f172a">Конец</text>
</svg>
