<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="880" height="190" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="190" fill="#ffffff"/>

  <!-- 1 -->
  <text x="120" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">1. Было</text>
  <text x="120" y="55" text-anchor="middle" font-size="13" fill="#64748b" font-family="ui-monospace, Menlo, Consolas, monospace">score</text>
  <rect x="55" y="62" width="130" height="68" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="120" y="107" text-anchor="middle" font-size="24" font-weight="600" fill="#0f172a">10</text>

  <line x1="196" y1="96" x2="318" y2="96" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2 -->
  <text x="440" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">2. Вычисляется правая часть</text>
  <rect x="330" y="62" width="220" height="68" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="440" y="90" text-anchor="middle" font-size="14" fill="#334155" font-family="ui-monospace, Menlo, Consolas, monospace">score + 5</text>
  <text x="440" y="112" text-anchor="middle" font-size="14" fill="#334155" font-family="ui-monospace, Menlo, Consolas, monospace">10 + 5  =  15</text>

  <line x1="561" y1="96" x2="683" y2="96" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3 -->
  <text x="760" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">3. Стало</text>
  <text x="760" y="55" text-anchor="middle" font-size="13" fill="#64748b" font-family="ui-monospace, Menlo, Consolas, monospace">score</text>
  <rect x="695" y="62" width="130" height="68" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="760" y="107" text-anchor="middle" font-size="24" font-weight="600" fill="#0f172a">15</text>

  <text x="440" y="165" text-anchor="middle" font-size="13" fill="#64748b">Старое значение ячейки исчезает: вернуть его уже нельзя</text>
</svg>
