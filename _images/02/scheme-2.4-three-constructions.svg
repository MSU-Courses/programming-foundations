<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="300" fill="#ffffff"/>

  <!-- Следование -->
  <rect x="70" y="70" width="150" height="36" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="145" y="93" text-anchor="middle" font-size="13" fill="#0f172a">Шаг 1</text>
  <line x1="145" y1="106" x2="145" y2="121" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="70" y="128" width="150" height="36" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="145" y="151" text-anchor="middle" font-size="13" fill="#0f172a">Шаг 2</text>
  <line x1="145" y1="164" x2="145" y2="179" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="70" y="186" width="150" height="36" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="145" y="209" text-anchor="middle" font-size="13" fill="#0f172a">Шаг 3</text>
  <text x="145" y="257" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Следование</text>
  <text x="145" y="278" text-anchor="middle" font-size="12" fill="#64748b">шаги идут один за другим</text>

  <!-- Ветвление -->
  <path d="M 440 66 L 515 100 L 440 134 L 365 100 Z" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="440" y="105" text-anchor="middle" font-size="12" fill="#0f172a">Условие</text>
  <line x1="365" y1="100" x2="375" y2="100" stroke="#475569" stroke-width="2"/>
  <line x1="375" y1="100" x2="375" y2="153" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="93" text-anchor="end" font-size="11" font-weight="600" fill="#334155">да</text>
  <line x1="515" y1="100" x2="505" y2="100" stroke="#475569" stroke-width="2"/>
  <line x1="505" y1="100" x2="505" y2="153" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="93" font-size="11" font-weight="600" fill="#334155">нет</text>
  <rect x="330" y="160" width="90" height="36" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="375" y="183" text-anchor="middle" font-size="13" fill="#0f172a">Шаг А</text>
  <rect x="460" y="160" width="90" height="36" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="505" y="183" text-anchor="middle" font-size="13" fill="#0f172a">Шаг Б</text>
  <line x1="375" y1="196" x2="375" y2="214" stroke="#475569" stroke-width="2"/>
  <line x1="505" y1="196" x2="505" y2="214" stroke="#475569" stroke-width="2"/>
  <line x1="375" y1="214" x2="505" y2="214" stroke="#475569" stroke-width="2"/>
  <line x1="440" y1="214" x2="440" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="440" y="257" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Ветвление</text>
  <text x="440" y="278" text-anchor="middle" font-size="12" fill="#64748b">выполняется одна из двух веток</text>

  <!-- Повторение -->
  <rect x="660" y="70" width="150" height="36" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="735" y="93" text-anchor="middle" font-size="13" fill="#0f172a">Шаг</text>
  <line x1="735" y1="106" x2="735" y2="123" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 735 130 L 800 160 L 735 190 L 670 160 Z" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="735" y="164" text-anchor="middle" font-size="11" fill="#0f172a">Ещё раз?</text>
  <line x1="670" y1="160" x2="625" y2="160" stroke="#475569" stroke-width="2"/>
  <line x1="625" y1="160" x2="625" y2="88" stroke="#475569" stroke-width="2"/>
  <line x1="625" y1="88" x2="652" y2="88" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="665" y="150" text-anchor="end" font-size="11" font-weight="600" fill="#334155">да</text>
  <line x1="735" y1="190" x2="735" y2="212" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="745" y="207" font-size="11" font-weight="600" fill="#334155">нет</text>
  <text x="735" y="257" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Повторение</text>
  <text x="735" y="278" text-anchor="middle" font-size="12" fill="#64748b">шаг выполняется несколько раз</text>
</svg>
