<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="880" height="200" fill="#ffffff"/>

  <!-- Начало и конец -->
  <ellipse cx="110" cy="70" rx="75" ry="32" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="110" y="76" text-anchor="middle" font-size="15" fill="#0f172a">Начало</text>
  <text x="110" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Начало и конец</text>
  <text x="110" y="160" text-anchor="middle" font-size="12" fill="#64748b">границы алгоритма</text>

  <!-- Действие -->
  <rect x="255" y="38" width="150" height="64" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="330" y="76" text-anchor="middle" font-size="15" fill="#0f172a">Действие</text>
  <text x="330" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Действие</text>
  <text x="330" y="160" text-anchor="middle" font-size="12" fill="#64748b">вычисление, изменение значения</text>

  <!-- Ввод и вывод -->
  <path d="M 485 102 L 512 38 L 645 38 L 618 102 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="565" y="76" text-anchor="middle" font-size="15" fill="#0f172a">Ввод, вывод</text>
  <text x="565" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Ввод и вывод</text>
  <text x="565" y="160" text-anchor="middle" font-size="12" fill="#64748b">обмен данными с внешним миром</text>

  <!-- Условие -->
  <path d="M 780 26 L 858 70 L 780 114 L 702 70 Z" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="780" y="75" text-anchor="middle" font-size="14" fill="#0f172a">Условие</text>
  <text x="780" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Проверка условия</text>
  <text x="780" y="160" text-anchor="middle" font-size="12" fill="#64748b">ровно два выхода: да и нет</text>
</svg>
